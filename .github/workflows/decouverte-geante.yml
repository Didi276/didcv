name: Decouverte geante entreprises

on:
  workflow_dispatch:

jobs:
  decouverte:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install @supabase/supabase-js node-fetch ws

      - name: Run discovery
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: node scripts/discover-companies.js

      - name: Upload decouvertes.json
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: decouvertes
          path: scripts/decouvertes.json
