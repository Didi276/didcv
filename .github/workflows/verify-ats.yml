name: Vérification ATS entreprises
on:
  workflow_dispatch:
    inputs:
      start:
        description: 'Index de début'
        required: false
        default: '0'
      end:
        description: 'Index de fin'
        required: false
        default: '80'

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm install node-fetch
      - run: node scripts/verify-all-ats.js
        env:
          START: ${{ inputs.start }}
          END: ${{ inputs.end }}
